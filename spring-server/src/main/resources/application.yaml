server:
  port: ${PORT:8083}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain,text/css
  shutdown: graceful

spring:
  application:
    name: admissions-server

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/nexus_admissions}}
    username: ${JDBC_DATABASE_USER:${DATABASE_USER:sa}}
    password: ${JDBC_DATABASE_PASSWORD:${DATABASE_PASSWORD:}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    locations: classpath:db/migration

  lifecycle:
    timeout-per-shutdown-phase: 20s

admissions:
  admin:
    bootstrap:
      # Opt in only when initializing an empty local database; never use default credentials in production.
      enabled: ${ADMISSIONS_ADMIN_BOOTSTRAP_ENABLED:false}
      email: ${ADMISSIONS_ADMIN_BOOTSTRAP_EMAIL:}
      password: ${ADMISSIONS_ADMIN_BOOTSTRAP_PASSWORD:}
      full-name: ${ADMISSIONS_ADMIN_BOOTSTRAP_FULL_NAME:Admissions Administrator}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

nap:
  backend:
    base-url: ${NAP_BACKEND_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://localhost:5179,http://localhost:5180,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://127.0.0.1:5176,http://127.0.0.1:5177,http://127.0.0.1:5178,http://127.0.0.1:5179,http://127.0.0.1:5180,http://localhost:4173,http://127.0.0.1:4173,http://localhost:18548,http://127.0.0.1:18548}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
nexus-identity:
  issuer-uri: ${NEXUS_IDENTITY_ISSUER_URI:http://localhost:9000}
  audience: ${NEXUS_IDENTITY_AUDIENCE:nexus-admissions-dashboard}

logging:
  level:
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
