server:
  port: 8081
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain,text/css
  shutdown: graceful

spring:
  application:
    name: admissions-server

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:admissionsdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    locations: classpath:db/migration

  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

nap:
  backend:
    base-url: ${NAP_BACKEND_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173}
  jwt:
    secret: ${JWT_SECRET:nexus-admissions-jwt-secret-key-2026-change-in-production}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}

logging:
  level:
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
